[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant-toolkit"
version = "0.1.0"
description = "A股量化工具箱 — 多策略每日竞赛系统，5大量化策略对决"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hermes Agent / Nous Research", email = "opensource@nousresearch.com"},
]
keywords = ["quant", "a-share", "china-stock", "trading", "strategy", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.5.0",
    "akshare>=1.14.0",
    "scikit-learn>=1.2.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/nousresearch/ashare-quant-toolkit"
Repository = "https://github.com/nousresearch/ashare-quant-toolkit"

[tool.setuptools.packages.find]
where = ["src"]
